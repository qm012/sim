name: golangci-lint

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.mod                                                                                                                                                      
            go.sum                                                                                                                                                      
            tools/*.mod                                                                                                                                                 
            tools/*.sum 

      - name: Check go mod tidy and go fix
        run: |
          go mod tidy
          go fix ./... 
          git add .
          git diff --cached --exit-code

      - name: Run golangci-lint
        run: make lint
